name: CI Pipeline

on:
  push:
    branches:
      - main
      - task-1

pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Flake8
      run: |
        flake8 src/

    - name: Run Tests
      run: |
        pytest
